<div #vizContainer id="viz" style="width: 100%; height: 600px;"></div>
<div class="node-details" *ngIf="selectedNode">
  <!-- <div><strong>Internal ID:</strong> {{ selectedNode.id }}</div> -->
  <div><strong>Group:</strong> {{ selectedNode.group }}</div>
  <div *ngFor="let k of getKeys(selectedNode.properties)">
    <strong>{{ k }}:</strong> {{ selectedNode.properties[k] }}
  </div>
</div>
